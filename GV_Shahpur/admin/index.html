<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Admin Login - Gyanoday Vidyalaya Shahpur</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link href="../img/H_logo.png" rel="icon">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/admin.css" rel="stylesheet">
</head>
<body class="admin-body">
    <div class="admin-login-wrap">
        <div class="admin-login-card">
            <img src="../img/H_logo.png" alt="Gyanoday Vidyalaya">
            <h4 class="text-center font-weight-bold mb-1" style="font-family:'Jost',sans-serif;color:#1F4E79;">Admin Panel</h4>
            <p class="text-center text-muted small mb-4">Gyanoday Vidyalaya, Shahpur — Website Manager</p>
            <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" id="loginEmail" required placeholder="admin@school.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-gv-primary btn-block py-2" id="loginBtn">
                    <i class="fa fa-sign-in-alt mr-2"></i>Sign In
                </button>
            </form>
            <p class="text-center mt-4 mb-0 small text-muted">
                <a href="../index.html"><i class="fa fa-arrow-left mr-1"></i>Back to Website</a>
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/gv-default-content.js"></script>
    <script src="../js/gv-firebase.js"></script>
    <script>
    (function () {
        if (!GVFirebase.isConfigured()) {
            document.getElementById("loginAlert").classList.remove("d-none");
            document.getElementById("loginAlert").innerHTML =
                "<strong>Firebase not configured.</strong> Edit <code>js/firebase-config.js</code> first. See <code>FIREBASE_SETUP.md</code>.";
            document.getElementById("loginForm").querySelector("button").disabled = true;
            return;
        }
        GVFirebase.onAuthChanged(function (user) {
            if (user && GVFirebase.isAdminUser(user)) {
                window.location.href = "dashboard.html";
            }
        });
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();
            var btn = document.getElementById("loginBtn");
            var alert = document.getElementById("loginAlert");
            alert.classList.add("d-none");
            btn.disabled = true;
            GVFirebase.signIn(
                document.getElementById("loginEmail").value.trim(),
                document.getElementById("loginPassword").value
            ).then(function (cred) {
                if (!GVFirebase.isAdminUser(cred.user)) {
                    return GVFirebase.signOut().then(function () {
                        throw new Error("This account is not authorized as admin.");
                    });
                }
                window.location.href = "dashboard.html";
            }).catch(function (err) {
                alert.classList.remove("d-none");
                alert.textContent = err.message || "Login failed.";
                btn.disabled = false;
            });
        });
    })();
    </script>
</body>
</html>
