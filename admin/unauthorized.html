<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Unauthorized Access — GV Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../GV_Shahpur/img/H_logo.png" rel="icon">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/admin.css" rel="stylesheet">
</head>
<body class="admin-body">
    <div class="admin-login-wrap">
        <div class="admin-login-card text-center">
            <div class="mb-3 text-danger">
                <i class="fa fa-exclamation-triangle fa-3x"></i>
            </div>
            <h4 class="font-weight-bold mt-2" style="color:#1F4E79;">Unauthorized Access</h4>
            <p class="text-muted mt-3">You do not have the required permissions (Super Admin) to view this page.</p>
            <div class="mt-4">
                <a href="dashboard.html" class="btn btn-gv-primary btn-block mb-2">Back to Dashboard</a>
                <button class="btn btn-outline-secondary btn-block" id="btnUnauthLogout">Sign Out</button>
            </div>
            <p class="mt-4 mb-0 small"><a href="index.html">Back to portal home</a></p>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/gv-firebase.js"></script>
    <script>
        firebase.auth().onAuthStateChanged(function (user) {
            if (!user) {
                window.location.replace("login.html");
            }
        });
        document.getElementById("btnUnauthLogout").onclick = function () {
            GVFirebase.signOut().then(function () {
                window.location.replace("login.html");
            });
        };
    </script>
</body>
</html>
