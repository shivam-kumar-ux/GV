<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Staff Signup — GV Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link href="../GV_Shahpur/img/H_logo.png" rel="icon">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/admin.css" rel="stylesheet">
</head>
<body class="admin-body">
    <div class="admin-login-wrap">
        <div class="admin-login-card admin-signup-card">
            <img src="../GV_Shahpur/img/H_logo.png" alt="Gyanoday Vidyalaya">
            <h4 class="text-center font-weight-bold mb-1" style="font-family:'Jost',sans-serif;color:#1F4E79;">Staff Registration</h4>
            <p class="text-center text-muted small mb-4">Admin will approve your account before you can edit websites.</p>
            <div id="signupAlert" class="alert d-none" role="alert"></div>
            <form id="signupForm">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Full Name *</label>
                        <input type="text" class="form-control" id="suName" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label>Staff ID * <small class="text-muted">(for login)</small></label>
                        <input type="text" class="form-control" id="suStaffId" required placeholder="e.g. GV-SP-042">
                    </div>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" class="form-control" id="suEmail" required>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Phone *</label>
                        <input type="tel" class="form-control" id="suPhone" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label>Designation *</label>
                        <select class="form-control" id="suDesignation" required>
                            <option value="">Select…</option>
                            <option>Principal</option>
                            <option>Vice Principal</option>
                            <option>Teacher</option>
                            <option>Office / Admin Staff</option>
                            <option>Accountant</option>
                            <option>Librarian</option>
                            <option>Hostel Warden</option>
                            <option>IT / Website Coordinator</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Department / Subject</label>
                        <input type="text" class="form-control" id="suDepartment" placeholder="e.g. Science, Office">
                    </div>
                    <div class="form-group col-md-6">
                        <label>Primary Campus *</label>
                        <select class="form-control" id="suCampus" required>
                            <option value="shahpur">Shahpur (active)</option>
                            <option value="t_dam">T. Dam (coming soon)</option>
                            <option value="all">All campuses</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Password *</label>
                        <input type="password" class="form-control" id="suPassword" required minlength="6">
                    </div>
                    <div class="form-group col-md-6">
                        <label>Confirm Password *</label>
                        <input type="password" class="form-control" id="suPassword2" required minlength="6">
                    </div>
                </div>
                <button type="submit" class="btn btn-gv-primary btn-block py-2" id="signupBtn">
                    <i class="fa fa-paper-plane mr-2"></i>Submit for Approval
                </button>
            </form>
            <p class="text-center mt-3 mb-0 small">
                <a href="login.html">Already registered? Login</a>
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/gv-firebase.js"></script>
    <script src="js/admin-auth.js"></script>
    <script>GVAuth.initSignupPage();</script>
</body>
</html>
